<style>
 *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
 :root{--black:#111;--white:#fff;--paper:#f5f4f1;--accent:#c8ff00;--muted:#57544b;--g300:#c9c6bd;--danger:#e4002b}
 body{background:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;color:var(--black)}
 .gate-card{width:100%;max-width:380px;text-align:center;background:var(--white);border:2px solid var(--black);box-shadow:6px 6px 0 var(--black);padding:38px 32px}
 .gate-logo{display:block;height:42px;width:auto;margin:0 auto 24px}
 .gate-title{font-weight:800;font-size:20px;letter-spacing:-.01em;margin-bottom:6px;line-height:1.1}
 .gate-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
 input{font-size:15px;color:var(--black);background:var(--white);border:2px solid var(--black);padding:13px 14px;width:100%;text-align:center;margin-bottom:12px;font-family:inherit}
 input:focus{outline:none;box-shadow:3px 3px 0 var(--black)}
 button{font-size:14px;font-weight:700;color:var(--black);background:var(--accent);border:2px solid var(--black);padding:13px 24px;cursor:pointer;width:100%;font-family:inherit;letter-spacing:.02em}
 button:hover{box-shadow:3px 3px 0 var(--black)}
 button:disabled{opacity:.6;cursor:default}
 .gate-err{color:var(--danger);font-size:13px;margin-top:14px;min-height:16px;font-family:'IBM Plex Mono',monospace}
 .gate-foot{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--g300);margin-top:22px}
</style>

<script>
(function(){
 var SALT="QaiYegr08YpXWLQApHxAuQ==", IV="ImN52pp6sqz/cp3d", ITER=250000, KEY="capchem_hub_pw";
 var form=document.getElementById('gateForm'),input=document.getElementById('gateInput'),
     btn=document.getElementById('gateBtn'),err=document.getElementById('gateErr');
 function b2b(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
 async function decrypt(pw){
   var enc=new TextEncoder();
   var ct=b2b(document.getElementById('payload').textContent.trim());
   var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
   var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2b(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
   var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2b(IV)},key,ct);
   return new TextDecoder().decode(buf);
 }
 function render(html){document.open();document.write(html);document.close();}
 async function tryUnlock(pw,silent){
   try{var html=await decrypt(pw);try{sessionStorage.setItem(KEY,pw);}catch(e){}render(html);}
   catch(e){ if(!silent){err.textContent='Incorrect password - try again.';input.value='';input.focus();}
             try{sessionStorage.removeItem(KEY);}catch(_){}
             btn.disabled=false;btn.textContent='Enter'; }
 }
 form.addEventListener('submit',function(e){e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Unlocking...';tryUnlock(input.value,false);});
 if(!(window.crypto&&crypto.subtle)){err.textContent='This browser blocks in-page decryption. Open the site over https://';}
 else{try{var saved=sessionStorage.getItem(KEY);if(saved)tryUnlock(saved,true);}catch(e){}}
})();
